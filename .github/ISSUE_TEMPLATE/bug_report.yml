name: Bug report / 报告问题
description: Something does not work as described, or fails. / 某个功能出错，或者和说明不一致。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not paste conversations, memory, credentials, tokens or private file paths; replace them with placeholders.

        感谢反馈。请不要贴出对话内容、记忆、凭据、令牌或私人文件路径，换成占位文字即可。
  - type: dropdown
    id: area
    attributes:
      label: Area / 涉及的功能
      options:
        - Installation and startup / 安装与启动
        - Conversations / 对话
        - Agent tools (Codex, Claude Code, Antigravity, DeepSeek) / Agent 工具
        - Prompts / 提示词
        - Shared memory and project instructions / 共同记忆与项目要求
        - Importing from another tool / 从其他工具导入
        - Moving conversations or backups to another computer (testing) / 换电脑搬对话或备份（功能测试中）
        - Memory sync between computers (testing) / 在电脑之间同步记忆（功能测试中）
        - Rooms, companions and workflows / 房间、伙伴与工作流
        - One-way mentions (testing) / 单向可见（功能测试中）
        - Exams (in development) / 考场（开发中）
        - Group conversations and phones (in development) / 群聊与手机（开发中）
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do? / 做了什么
      description: Steps to reproduce, as specific as you can. / 复现步骤，越具体越好。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead? / 实际结果
      description: Include any error text or a screenshot. / 请附上报错文字或截图。
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system / 操作系统
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version / Node.js 版本
      description: Output of `node --version`. / `node --version` 的输出。
      placeholder: v24.0.0
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Agent tool and version / Agent 工具及版本
      description: Leave empty if no agent tool is involved. / 不涉及 Agent 工具可以留空。
      placeholder: Codex (output of codex --version)
  - type: input
    id: version
    attributes:
      label: StarPort version / 星港版本
      description: The commit (`git rev-parse --short HEAD`) or the date you downloaded the ZIP. / 运行的提交号（`git rev-parse --short HEAD`），或下载 ZIP 的日期。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else / 其他补充
