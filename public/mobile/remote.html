<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#091725">
  <title>星港 · 电脑对话</title>
  <link rel="icon" href="/mobile/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/mobile/remote.css?v=1">
  <script defer src="/vendor/marked.min.js"></script>
  <script defer src="/vendor/purify.min.js"></script>
  <script defer src="/mobile/remote.js?v=1"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><img src="/mobile/icon.svg" width="30" height="30" alt=""><b>星港</b></div>
    <span id="account"></span><button id="logout" type="button" hidden>退出</button>
  </header>
  <main id="workspace" data-page="devices">
    <nav class="devices" aria-label="电脑">
      <h1>电脑</h1>
      <div id="devices"></div>
    </nav>
    <nav class="conversations" aria-label="对话">
      <header class="panel-title"><button class="back" id="back-devices" type="button" aria-label="返回电脑">‹</button>
        <div><h2>对话</h2><span id="device-name"></span></div>
      </header>
      <div id="chats"></div>
    </nav>
    <section class="conversation" aria-label="当前对话">
      <header class="panel-title"><button class="back" id="back-chats" type="button" aria-label="返回对话列表">‹</button>
        <div><h2 id="chat-title">选择对话</h2><span id="agent"></span></div>
        <button id="stop" type="button" hidden>停止</button>
      </header>
      <div id="transcript" tabindex="0" aria-label="消息记录">
        <button id="older" type="button" hidden>查看更早消息</button>
        <div id="messages"></div>
        <div id="approvals"></div>
      </div>
      <form id="composer" hidden>
        <textarea id="draft" aria-label="发给当前 Agent" placeholder="发给当前 Agent…" rows="1" maxlength="20000" required></textarea>
        <button type="submit" id="send">发送</button>
      </form>
    </section>
  </main>
  <p id="status" role="status" aria-live="polite" hidden></p>
</body>
</html>
