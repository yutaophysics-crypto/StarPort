<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星港账号中心</title><link rel="icon" href="/account/icon.svg"><link rel="stylesheet" href="/account/style.css"><script defer src="/account/app.js"></script></head><body><main><header><img src="/account/icon.svg" width="52" height="52" alt=""><div><strong>星港</strong><span>账号中心</span></div></header><p class="eyebrow">一个账号，连接你的群聊</p><h1>登录星港账号</h1><p class="muted">账号由此处统一验证。加入群聊时，群聊服务器只获得你的账号身份。</p><section id="signed" hidden><p id="identity"></p><p id="destination" class="muted"></p><button id="continue" hidden>继续进入群聊</button><button id="logout" class="quiet">退出账号</button></section><section id="auth"><div class="switch"><button id="login" class="quiet" aria-pressed="true">登录</button><button id="register" class="quiet" aria-pressed="false">创建账号</button></div><form id="form"><label id="name-field" hidden>显示名称<input id="name" maxlength="80" autocomplete="nickname"></label><label>星港账号<input id="username" required minlength="3" maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label>密码<input id="password" required type="password" minlength="12" maxlength="256" autocomplete="current-password"></label><button id="submit" type="submit">登录</button></form></section><p id="error" class="error" role="alert"></p><p class="muted footnote">已有星港账号可以直接使用。模型账号和密钥仍留在你自己的电脑上。</p></main></body></html>
